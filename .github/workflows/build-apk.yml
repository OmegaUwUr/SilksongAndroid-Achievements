name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /

          # The APK is built entirely inside our Docker image, so the large
          # Android/.NET/Haskell/CodeQL toolchains preinstalled on the GitHub
          # host are redundant. Removing them typically frees many gigabytes.
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /opt/hostedtoolcache/Python || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true

          # Remove package-manager caches and any images left on the runner.
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          docker system prune -af || true

          echo "Disk after cleanup:"
          df -h /

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \t\r\n' < VERSION)"
          [[ -n "$version" ]] || { echo "::error::VERSION is empty"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore persistent signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "$SIGNING_KEYSTORE_BASE64" ]] || {
            echo "::error::Missing GitHub Actions secret SIGNING_KEYSTORE_BASE64"
            exit 1
          }
          [[ -n "$SIGNING_STORE_PASSWORD" ]] || {
            echo "::error::Missing GitHub Actions secret SIGNING_STORE_PASSWORD"
            exit 1
          }
          [[ -n "$SIGNING_KEY_ALIAS" ]] || {
            echo "::error::Missing GitHub Actions secret SIGNING_KEY_ALIAS"
            exit 1
          }
          [[ -n "$SIGNING_KEY_PASSWORD" ]] || {
            echo "::error::Missing GitHub Actions secret SIGNING_KEY_PASSWORD"
            exit 1
          }

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/silksong-build.jks"
          chmod 600 "$RUNNER_TEMP/silksong-build.jks"

          # Fail before doing an expensive Docker build if the secret is corrupt,
          # the password is wrong, or the configured alias is missing.
          keytool -list \
            -keystore "$RUNNER_TEMP/silksong-build.jks" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" >/dev/null

          echo "Persistent APK signing key restored and validated."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build APK image
        uses: docker/build-push-action@v6
        with:
          context: tools/docker
          file: tools/docker/apk.Dockerfile
          platforms: linux/amd64
          tags: silksong-apk:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Show disk after Docker image
        shell: bash
        run: |
          df -h /
          docker system df

      - name: Cache Unity Android player module
        uses: actions/cache@v4
        with:
          path: .ci-cache/unity-player
          key: unity-player-${{ hashFiles('tools/ondevice-il2cpp/fetch-unity.sh') }}

      - name: Build signed APK
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .ci-cache/unity-player .ci-cache/nuget .ci-cache/build build
          cp "$RUNNER_TEMP/silksong-build.jks" .ci-cache/build.jks
          chmod 600 .ci-cache/build.jks

          echo "Disk before APK build:"
          df -h /

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/unity-player:/opt/unity-player" \
            -v "$PWD/.ci-cache/nuget:/root/.nuget/packages" \
            -v "$PWD/.ci-cache/build:/root/.cache/silksong" \
            -e GRADLE_DAEMON=0 \
            -e DEBUGGABLE=1 \
            -e KEYSTORE=/workspace/.ci-cache/build.jks \
            -e KS_PASS="$SIGNING_STORE_PASSWORD" \
            -e KEY_PASS="$SIGNING_KEY_PASSWORD" \
            -e KEY_ALIAS="$SIGNING_KEY_ALIAS" \
            silksong-apk:latest apk

          rm -f .ci-cache/build.jks
          sudo chown -R "$(id -u):$(id -g)" .ci-cache build

          apk="$(find build -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$apk" && -f "$apk" ]] || { echo "::error::Build completed without an APK in build/"; exit 1; }
          echo "Built $apk"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SilksongAndroid-${{ steps.version.outputs.version }}-achievements
          path: build/*.apk
          if-no-files-found: error
          retention-days: 14

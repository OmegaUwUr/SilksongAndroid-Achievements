name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /opt/hostedtoolcache/Python || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true

          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          docker system prune -af || true

          echo "Disk after cleanup:"
          df -h /

      - name: Read managed version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(tr -d ' \t\r\n' < VERSION)"
          revision="$(tr -d ' \t\r\n' < APP_REVISION)"

          [[ "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::VERSION must be major.minor.patch; got '$upstream'"
            exit 1
          }
          [[ "$revision" =~ ^[0-9]+$ ]] || {
            echo "::error::APP_REVISION must be an integer; got '$revision'"
            exit 1
          }
          (( revision >= 0 && revision < 100 )) || {
            echo "::error::APP_REVISION must be between 0 and 99"
            exit 1
          }

          IFS='.' read -r major minor patch <<< "$upstream"
          (( minor < 100 && patch < 100 )) || {
            echo "::error::VERSION minor and patch must be below 100"
            exit 1
          }

          base_code=$((major * 10000 + minor * 100 + patch))
          version_code=$((base_code * 100 + revision))
          version_name="${upstream}-achievements.${revision}"
          short_sha="${GITHUB_SHA::7}"

          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

          echo "Managed APK version: $version_name"
          echo "Android versionCode: $version_code"
          echo "Source commit: $short_sha"

      - name: Stage official Steam desktop icon
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/depot-to-apk/fetch-steam-icon.py tools/depot-to-apk/shell/res

      - name: Restore fallback signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing
          key: silksong-apk-fallback-signing-v1

      - name: Prepare APK signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          have_keystore=0
          have_store_pass=0
          have_alias=0
          have_key_pass=0
          [[ -n "$SIGNING_KEYSTORE_BASE64" ]] && have_keystore=1
          [[ -n "$SIGNING_STORE_PASSWORD" ]] && have_store_pass=1
          [[ -n "$SIGNING_KEY_ALIAS" ]] && have_alias=1
          [[ -n "$SIGNING_KEY_PASSWORD" ]] && have_key_pass=1
          configured=$((have_keystore + have_store_pass + have_alias + have_key_pass))

          if [[ "$configured" -eq 4 ]]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/silksong-build.jks"
            chmod 600 "$RUNNER_TEMP/silksong-build.jks"

            keytool -list \
              -keystore "$RUNNER_TEMP/silksong-build.jks" \
              -storepass "$SIGNING_STORE_PASSWORD" \
              -alias "$SIGNING_KEY_ALIAS" >/dev/null

            echo "APK_KS_PASS=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "APK_KEY_PASS=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APK_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "APK_SIGNING_SOURCE=repository secrets" >> "$GITHUB_ENV"
            echo "Persistent APK signing key restored and validated."
          elif [[ "$configured" -ne 0 ]]; then
            echo "::error::Signing secrets are only partially configured. Set all four SIGNING_* secrets, or remove the partial set to use the cached CI key."
            exit 1
          else
            mkdir -p .ci-signing
            fallback=.ci-signing/fallback.jks
            fallback_store_pass=android
            fallback_key_pass=android
            fallback_alias=silksong-ci

            if [[ ! -s "$fallback" ]]; then
              echo "No signing secrets configured; generating a cached CI signing certificate."
              keytool -genkeypair -v \
                -keystore "$fallback" \
                -storepass "$fallback_store_pass" \
                -keypass "$fallback_key_pass" \
                -alias "$fallback_alias" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=SilksongAndroid CI, OU=Build, O=SilksongAndroid, L=CI, ST=CI, C=CA" >/dev/null
            else
              echo "Using cached CI signing certificate."
            fi

            keytool -list \
              -keystore "$fallback" \
              -storepass "$fallback_store_pass" \
              -alias "$fallback_alias" >/dev/null
            cp "$fallback" "$RUNNER_TEMP/silksong-build.jks"
            chmod 600 "$RUNNER_TEMP/silksong-build.jks"

            echo "APK_KS_PASS=$fallback_store_pass" >> "$GITHUB_ENV"
            echo "APK_KEY_PASS=$fallback_key_pass" >> "$GITHUB_ENV"
            echo "APK_KEY_ALIAS=$fallback_alias" >> "$GITHUB_ENV"
            echo "APK_SIGNING_SOURCE=cached CI key" >> "$GITHUB_ENV"
            echo "::warning::Repository signing secrets are not configured. This build uses the stable Actions-cached CI certificate."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build APK image
        uses: docker/build-push-action@v6
        with:
          context: tools/docker
          file: tools/docker/apk.Dockerfile
          platforms: linux/amd64
          tags: silksong-apk:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Show disk after Docker image
        shell: bash
        run: |
          df -h /
          docker system df

      - name: Cache Unity Android player module
        uses: actions/cache@v4
        with:
          path: .ci-cache/unity-player
          key: unity-player-${{ hashFiles('tools/ondevice-il2cpp/fetch-unity.sh') }}

      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-cache/unity-player .ci-cache/nuget .ci-cache/build build
          cp "$RUNNER_TEMP/silksong-build.jks" .ci-cache/build.jks
          chmod 600 .ci-cache/build.jks

          echo "Signing source: $APK_SIGNING_SOURCE"
          echo "Building ${{ steps.version.outputs.version }} (versionCode ${{ steps.version.outputs.version_code }})"
          echo "Disk before APK build:"
          df -h /

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/unity-player:/opt/unity-player" \
            -v "$PWD/.ci-cache/nuget:/root/.nuget/packages" \
            -v "$PWD/.ci-cache/build:/root/.cache/silksong" \
            -e GRADLE_DAEMON=0 \
            -e DEBUGGABLE=1 \
            -e VERSION_NAME="${{ steps.version.outputs.version }}" \
            -e VERSION_CODE="${{ steps.version.outputs.version_code }}" \
            -e APK_NAME="SilksongAndroid-${{ steps.version.outputs.version }}.apk" \
            -e KEYSTORE=/workspace/.ci-cache/build.jks \
            -e KS_PASS="$APK_KS_PASS" \
            -e KEY_PASS="$APK_KEY_PASS" \
            -e KEY_ALIAS="$APK_KEY_ALIAS" \
            silksong-apk:latest apk

          rm -f .ci-cache/build.jks
          sudo chown -R "$(id -u):$(id -g)" .ci-cache build

          apk="$(find build -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$apk" && -f "$apk" ]] || { echo "::error::Build completed without an APK in build/"; exit 1; }
          echo "Built $apk"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SilksongAndroid-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          path: build/*.apk
          if-no-files-found: error
          retention-days: 14

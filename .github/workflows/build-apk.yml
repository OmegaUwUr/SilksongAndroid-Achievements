name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /

          # The APK is built entirely inside our Docker image, so the large
          # Android/.NET/Haskell/CodeQL toolchains preinstalled on the GitHub
          # host are redundant. Removing them typically frees many gigabytes.
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /opt/hostedtoolcache/Python || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true

          # Remove package-manager caches and any images left on the runner.
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          docker system prune -af || true

          echo "Disk after cleanup:"
          df -h /

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \t\r\n' < VERSION)"
          [[ -n "$version" ]] || { echo "::error::VERSION is empty"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create temporary signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/silksong-build.jks" \
            -storepass android \
            -keypass android \
            -alias silksong \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=SilksongAndroid CI Build, OU=CI, O=SilksongAndroid, C=US" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build APK image
        uses: docker/build-push-action@v6
        with:
          context: tools/docker
          file: tools/docker/apk.Dockerfile
          platforms: linux/amd64
          tags: silksong-apk:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Show disk after Docker image
        shell: bash
        run: |
          df -h /
          docker system df

      - name: Cache Unity Android player module
        uses: actions/cache@v4
        with:
          path: .ci-cache/unity-player
          key: unity-player-${{ hashFiles('tools/ondevice-il2cpp/fetch-unity.sh') }}

      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-cache/unity-player .ci-cache/nuget .ci-cache/build build
          cp "$RUNNER_TEMP/silksong-build.jks" .ci-cache/build.jks

          echo "Disk before APK build:"
          df -h /

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/unity-player:/opt/unity-player" \
            -v "$PWD/.ci-cache/nuget:/root/.nuget/packages" \
            -v "$PWD/.ci-cache/build:/root/.cache/silksong" \
            -e GRADLE_DAEMON=0 \
            -e DEBUGGABLE=1 \
            -e KEYSTORE=/workspace/.ci-cache/build.jks \
            -e KS_PASS=android \
            -e KEY_PASS=android \
            -e KEY_ALIAS=silksong \
            silksong-apk:latest apk

          rm -f .ci-cache/build.jks
          sudo chown -R "$(id -u):$(id -g)" .ci-cache build

          apk="$(find build -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$apk" && -f "$apk" ]] || { echo "::error::Build completed without an APK in build/"; exit 1; }
          echo "Built $apk"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SilksongAndroid-${{ steps.version.outputs.version }}-achievements
          path: build/*.apk
          if-no-files-found: error
          retention-days: 14

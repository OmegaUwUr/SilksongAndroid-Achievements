name: Restore package files

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-package.yml'
      - 'patches/**'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact SilksongAndroid v1.0.3 files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/silksong-upstream
          git clone --depth 1 --branch v1.0.3 \
            https://github.com/jakobkhansen/SilksongAndroid.git \
            /tmp/silksong-upstream

          # Copy the exact v1.0.3 release into this repository. Keep this
          # repository's custom workflows and BUILD_APK.md in place.
          rsync -a --exclude='.git/' --exclude='.github/workflows/' \
            /tmp/silksong-upstream/ ./

      - name: Apply Steam achievement changes
        shell: bash
        run: |
          set -euo pipefail
          cat patches/achievements.patch.00 \
              patches/achievements.patch.01 \
              patches/achievements.patch.02 > /tmp/achievements.patch
          patch -p2 < /tmp/achievements.patch

      - name: Verify restored project
        shell: bash
        run: |
          set -euo pipefail
          test -f src/SilksongLauncher.Launcher/app/src/main/kotlin/dev/silksong/launcher/AchievementService.kt
          test -f src/SilksongLauncher.Launcher/app/src/main/cpp/steam/steam_api_shim.c
          test -f tools/docker/apk.Dockerfile
          test -f tools/depot-to-apk/build.sh
          test -f tools/bundle-surgery/classdata.tpk
          test -f docs/icon.png
          grep -q 'add_subdirectory(steam)' src/SilksongLauncher.Launcher/app/src/main/cpp/CMakeLists.txt
          grep -q 'AchievementService.start' src/SilksongLauncher.Launcher/app/src/main/kotlin/dev/silksong/launcher/LauncherActivity.kt
          grep -q 'ndk;27.2.12479018' tools/docker/apk.Dockerfile

      - name: Commit restored files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Repository already contains all package files.'
            exit 0
          fi
          git commit -m 'Restore complete v1.0.3 achievement-enabled project'
          git push origin HEAD:main
